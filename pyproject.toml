[project]
name = "d3text"
version = "0.1.0"
description = "Text mining models for database expansion developed within the DSMZ Digital Diversity Hub"
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
requires-python = ">=3.12, <3.13"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "datasets>=3.1.0,<4",
  "jaxtyping>=0.3.2",
  "lxml>=5.2.2,<6",
  "retrying>=1.3.4,<2",
  "seqeval>=1.2.2,<2",
  "transformers>=4.42",
  "xmltodict>=0.14.0,<0.15",
  "tomlkit>=0.13.2",
  "h5py>=3.13.0",
  "hdf5plugin>=5.1.0",
  "cacheout>=0.16.0",
  "ordered-set>=4.1.0",
  "brenda-references @ file:///${PROJECT_ROOT}/brenda_references",
  "xmlparser @ git+https://github.com/manuquadros/xmlparser.git@master",
  "polars>=1.33.1",
  "rapidfuzz==3.14.1,<4",
  "lmdb>=1.7.3",
  "blosc2>=3.8.0",
  "torch>=2.7.0",
]

[project.optional-dependencies]
rocm = ["pytorch-triton-rocm"]

[project.scripts]
train = "d3text.cli.train:main"
tuning = "d3text.cli.tune:main"
evaluate = "d3text.cli.evaluate:main"
precompute-encodings = "d3text.cli.precompute_encodings:main"
precompute-embeddings = "d3text.cli.precompute_embeddings:main"

[dependency-groups]
dev = [
  "beartype>=0.21.0",
  "ipython-autotime>=0.3.2",
  "mkdocs-material>=9.6.21",
  "mkdocstrings-python>=1.16.12",
  "mypy>=1.11",
  "pudb>=2025.1",
  "pympler>=1.1",
  "pytest>=8.4.1",
  "pytest-cov>=5.0.0",
  "torchinfo>=1.8.0",
  "types-tqdm>=4.66",
]

# The torch build is a property of the machine, not of the project, so the index
# is selected by TORCH_FLAVOUR (cpu | cu118 | cu128 | rocm6.3) rather than by a
# dependency extra: pdm has no way to bind an index to an extra, but it does
# expand ${VAR} inside a source URL. Only lock time reads it -- the lockfiles are
# built with --static-urls, so installing needs neither the variable nor the
# index. include_packages keeps every other package on PyPI.
# Relocking is all-or-nothing: the flavour is chosen during resolution, so a
# dependency change invalidates all four lockfiles at once. `pdm run lock-all`
# regenerates them; `pdm run check-locks` is the assertion CI makes.
[tool.pdm.scripts]
lock-cpu = { cmd = "pdm lock --static-urls -L locks/cpu.lock", env = { TORCH_FLAVOUR = "cpu" } }
lock-cu118 = { cmd = "pdm lock --static-urls -L locks/cu118.lock", env = { TORCH_FLAVOUR = "cu118" } }
lock-cu128 = { cmd = "pdm lock --static-urls -L locks/cu128.lock", env = { TORCH_FLAVOUR = "cu128" } }
lock-rocm = { cmd = "pdm lock --static-urls -L locks/rocm.lock -G rocm", env = { TORCH_FLAVOUR = "rocm6.3" } }
lock-all = { composite = ["lock-cpu", "lock-cu118", "lock-cu128", "lock-rocm"] }

check-cpu = { cmd = "pdm lock --check -L locks/cpu.lock", env = { TORCH_FLAVOUR = "cpu" } }
check-cu118 = { cmd = "pdm lock --check -L locks/cu118.lock", env = { TORCH_FLAVOUR = "cu118" } }
check-cu128 = { cmd = "pdm lock --check -L locks/cu128.lock", env = { TORCH_FLAVOUR = "cu128" } }
check-rocm = { cmd = "pdm lock --check -L locks/rocm.lock -G rocm", env = { TORCH_FLAVOUR = "rocm6.3" } }
check-locks = { composite = [
  "check-cpu",
  "check-cu118",
  "check-cu128",
  "check-rocm",
] }

[tool.pdm.resolution.overrides]
lpsn-interface = "git+https://github.com/manuquadros/lpsn-interface"
ncbitax = "git+https://github.com/manuquadros/ncbitax"
d3types = "git+https://github.com/manuquadros/d3types"
apiadapters = "git+https://github.com/manuquadros/apiadapters"
gme = "git+https://github.com/idiap/gme-sampler"
xmlparser = "git+https://github.com/manuquadros/xmlparser.git@master"

[[tool.pdm.source]]
name = "torch"
url = "https://download.pytorch.org/whl/${TORCH_FLAVOUR}"
include_packages = [
  "torch",
  "torchvision",
  "torchaudio",
  "pytorch-triton-rocm",
  "triton",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs network, GPU, or the full BRENDA data files",
  "slow: takes more than a couple of seconds",
  "gpu: needs a CUDA device; auto-skipped when none is available, so it runs by default on GPU machines and is a no-op on CPU CI",
]
# Default run excludes integration tests; opt in with `pytest -m integration`.
# `gpu` tests are NOT excluded here: they auto-skip on CPU (see conftest) and
# run automatically wherever a CUDA device is present.
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/d3text"]
omit = ["*/tests/*", "scripts/*", "*/d3text/cli/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F722"]

[tool.mypy]
[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "cacheout.*",
  "seqeval.*",
  "stackprinter.*",
  "datasets.*",
  "h5py.*",
  "pandas.*",
  "blosc2.*",
]
ignore_missing_imports = true
