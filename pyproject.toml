[project]
name = "d3text"
version = "0.1.0"
description = "Text mining models for database expansion developed within the DSMZ Digital Diversity Hub"
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
requires-python = ">=3.12, <3.13"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "datasets>=3.1.0,<4",
  "jaxtyping>=0.3.2",
  "lxml>=5.2.2,<6",
  "retrying>=1.3.4,<2",
  "seqeval>=1.2.2,<2",
  "transformers>=4.42",
  "xmltodict>=0.14.0,<0.15",
  "tomlkit>=0.13.2",
  "h5py>=3.13.0",
  "hdf5plugin>=5.1.0",
  "cacheout>=0.16.0",
  "ordered-set>=4.1.0",
  "brenda-references @ file:./brenda_references",
  "xmlparser @ git+https://github.com/manuquadros/xmlparser.git@master",
  "polars>=1.33.1",
  "rapidfuzz==3.14.1,<4",
  "lmdb>=1.7.3",
  "blosc2>=3.8.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.7.0"]
cu128 = ["torch>=2.7.0"]
cu118 = ["torch>=2.7.0"]
rocm = ["torch>=2.7.0", "pytorch-triton-rocm"]

[project.scripts]
feed = "scripts.feed:main"
train = "scripts.train:main"
backend_start = "backend.run:main"
get_annotation_targets = "scripts.get_annotation_targets:main"
reset_annotations = "scripts.reset_annotations:main"
train_tokenizer = "scripts.train_tokenizer:main"
tuning = "scripts.tuning:main"

[dependency-groups]
dev = [
  "beartype>=0.21.0",
  "ipython-autotime>=0.3.2",
  "mkdocs-material>=9.6.21",
  "mkdocstrings-python>=1.16.12",
  "pudb>=2025.1",
  "pympler>=1.1",
  "pytest>=8.4.1",
  "torchinfo>=1.8.0",
]

[[tool.pdm.source]]
name = "torch_cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.pdm.source]]
name = "torch_cuda"
url = "https://download.pytorch.org/whl/cu128"

[[tool.pdm.source]]
name = "torch_cuda118"
url = "https://download.pytorch.org/whl/cu118"

[[tool.pdm.source]]
name = "torch_rocm"
url = "https://download.pytorch.org/whl/rocm6.3"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F722"]

[tool.mypy-seqeval]
disable_error_code = "import_untyped"

[tool.mypy-transformers]
follow_imports = "silent"

[tool.mypy-sqlmodel]
follow_imports = "silent"

[tool.mypy]
plugins = "sqlmypy"
