[project]
name = "d3text"
version = "0.1.0"
description = "Text mining models for database expansion developed within the DSMZ Digital Diversity Hub"
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
requires-python = ">=3.12, <3.13"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "datasets>=3.1.0,<4",
  "jaxtyping>=0.3.2",
  "lxml>=5.2.2,<6",
  "retrying>=1.3.4,<2",
  "seqeval>=1.2.2,<2",
  "transformers>=4.42",
  "xmltodict>=0.14.0,<0.15",
  "tomlkit>=0.13.2",
  "h5py>=3.13.0",
  "hdf5plugin>=5.1.0",
  "cacheout>=0.16.0",
  "ordered-set>=4.1.0",
  "brenda-references",
  "xmlparser @ git+https://github.com/manuquadros/xmlparser.git@master",
  "polars>=1.33.1",
  "rapidfuzz==3.14.1,<4",
  "lmdb>=1.7.3",
  "blosc2>=3.8.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.7.0"]
cu128 = ["torch>=2.7.0"]
cu118 = ["torch>=2.7.0"]
rocm = ["torch>=2.7.0", "pytorch-triton-rocm"]

[project.scripts]
train = "d3text.cli.train:main"
tuning = "d3text.cli.tune:main"
evaluate = "d3text.cli.evaluate:main"
precompute-encodings = "d3text.cli.precompute_encodings:main"
precompute-embeddings = "d3text.cli.precompute_embeddings:main"

[dependency-groups]
dev = [
  "beartype>=0.21.0",
  "ipython-autotime>=0.3.2",
  "mkdocs-material>=9.6.21",
  "mkdocstrings-python>=1.16.12",
  "mypy>=1.11",
  "pudb>=2025.1",
  "pympler>=1.1",
  "pytest>=8.4.1",
  "pytest-cov>=5.0.0",
  # Pinned into the project rather than left to whatever is on PATH: an older
  # ruff reformats the committed code back to its own style, so the version
  # decided whether `ruff format --check` passed.
  "ruff>=0.9",
  "torchinfo>=1.8.0",
  "types-tqdm>=4.66",
]

# Torch is provided as four mutually-exclusive extras, one per target
# environment (this box -> cu128, the P100 VM -> cu118, AMD -> rocm, plus a
# cpu fallback). Install exactly one, e.g. `pdm install -G cu128`.
# pdm drives uv as its backend, so uv reads this config natively.
[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
    { extra = "cu118" },
    { extra = "rocm" },
  ],
]

[[tool.uv.index]]
name = "torch_cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "torch_cuda118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "torch_rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "torch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
brenda-references = { path = "brenda_references", editable = true }
torch = [
  { index = "torch_cpu", extra = "cpu" },
  { index = "torch_cuda", extra = "cu128" },
  { index = "torch_cuda118", extra = "cu118" },
  { index = "torch_rocm", extra = "rocm" },
]
pytorch-triton-rocm = { index = "torch_rocm", extra = "rocm" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: downloads from the Hugging Face Hub; runs anywhere with a network, so the nightly CI job opts in",
  "data: needs the BRENDA corpus and its encodings, which are not in the repo; auto-skipped where they are absent, so it can only run where the data is",
  "slow: takes more than a couple of seconds",
  "gpu: needs a working GPU; auto-skipped when none is usable, so it runs by default on GPU machines and is a no-op on CPU CI",
]
# The default run is the offline, data-free suite. `network` is excluded here
# and opted into (`pytest -m network`) because nothing can test for a reachable
# Hub without hitting it. `data` is excluded too, but belt-and-braces: it also
# auto-skips wherever the corpus is missing, so `-m data` on a machine without
# it skips rather than errors.
# `gpu` is NOT excluded: it auto-skips unless a device can actually run a
# kernel (see conftest), so it is a no-op on CPU CI and live on a GPU box.
addopts = "-m 'not network and not data'"

[tool.coverage.run]
source = ["src/d3text"]
omit = ["*/tests/*", "scripts/*", "*/d3text/cli/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F722"]

[tool.mypy]
[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "cacheout.*",
  "seqeval.*",
  "stackprinter.*",
  "datasets.*",
  "h5py.*",
  "pandas.*",
  "blosc2.*",
]
ignore_missing_imports = true
