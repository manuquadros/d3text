# The score this config records was earned *before* `separate_predicate_layer`
# was wired into the relation head: the flag was read from the config, dropped on
# the floor, and every model trained with the subject/object projection shared.
# The run that produced this number therefore had a shared projection despite the
# `true` below, and re-training this config now yields a genuinely different
# architecture. Treat the recorded score as not comparable until re-run.

optimizer = "nadam"
lr = 0.001
lr_scheduler = "exponential"
dropout = 0.2
hidden_layers = [128]
normalization = "layer"
batch_size = 16
batch_max_chunks = 512
num_epochs = 100
patience = 10
base_model = "michiyasunaga/BioLinkBERT-base"
entity_loss_scaling_factor = 1
relation_label_smoothing = 0
model_class = "ETEBrendaModel"
common_hidden_block = true
ramp_epochs = 4
separate_predicate_layer = true
