# Wily reads an INI file of its own, not pyproject.toml, and looks for this
# name by default. Run it through `scripts/wily.sh`, which keeps the history
# walk out of the working tree; see CLAUDE.md, "Complexity metrics".
#
# `path` and `cache_path` are deliberately absent. The CLI overwrites `path`
# with its own default on every invocation, so a value here would be dead, and
# a cache path is machine-specific — the wrapper pins it at run time instead.
[wily]
operators = raw,maintainability,cyclomatic,halstead

# The cache holds a full metrics snapshot per revision, not a delta, so it runs
# about 1.3 MB per recent commit: 200 revisions is ~210 MB and 25 seconds. The
# whole 1062-commit history is only ~300 MB and 85 seconds, since the older
# revisions indexed a much smaller tree — `build -n 1200 src/d3text` if the
# longer curve is worth that. Builds are from scratch; the wrapper says why.
max_revisions = 200

# There are no notebooks in this tree, and scanning for them loads nbformat.
include_ipynb = false
