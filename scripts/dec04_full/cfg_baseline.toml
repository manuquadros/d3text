optimizer = "nadam"
lr = 0.001
lr_scheduler = "exponential"
dropout = 0.2
hidden_layers = [128]
normalization = "layer"
batch_size = 8
batch_max_chunks = 64
num_epochs = 6
patience = 10
base_model = "michiyasunaga/BioLinkBERT-base"
relation_label_smoothing = 0
model_class = "ETEBrendaModel"
common_hidden_block = true
ramp_epochs = 4
separate_predicate_layer = true
# Stated rather than left to the default, because this run's whole point is a
# comparison and the default has moved once already: DEC-03 shipped per-class
# pooling and then reversed it. A later reader must be able to see which
# pooling produced these numbers without dating the commit.
entity_logits_pooling = "logmeanexp"
