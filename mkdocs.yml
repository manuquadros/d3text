site_name: "D3Text"

theme:
  name: "material"

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            filters: public
            docstring_style: sphinx

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables

nav:
  - Home: index.md
  - Data path: data.md
  - Distant supervision: distant-supervision.md
  - Surface forms: surface-forms.md
  - Schema and checkpoints: schema-and-checkpoints.md
  - Dataset and factory: dataset-and-factory.md
  - Models: models.md
  - Evaluation: evaluation.md
  - CLI and training: cli-and-training.md
  - Runtime and tracking: runtime-and-tracking.md
  - Utilities: utils.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
