name: integration

# The integration tests are excluded from the default push/PR run (see
# tests.yml). They download tiny Hugging Face models, so run them on a schedule
# rather than gating every push. `test_all_entity_classes_in_splits` needs the
# ~300 MB BRENDA encodings, which no hosted runner has, so it auto-skips here;
# this job's job is to catch transformers-version rot in the model/tokenizer
# loading path (the BUG-01 class of failure).

on:
  schedule:
    - cron: "0 3 * * *"   # nightly, 03:00 UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"

      # TORCH_FLAVOUR only has to match what locks/cpu.lock was built with, so
      # that the lock-input hash lines up; the lock carries static wheel URLs, so
      # the install itself never contacts the torch index.
      - name: Assert locks/cpu.lock matches pyproject
        run: pdm lock --check -L locks/cpu.lock
        env:
          TORCH_FLAVOUR: cpu

      - name: Install dependencies (CPU torch + dev group)
        run: pdm install -L locks/cpu.lock --frozen-lockfile

      - name: Provide machine config
        run: cp config.toml.example config.toml

      - name: Run integration tests
        run: pdm run pytest -m integration -v
