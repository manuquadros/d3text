name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (CPU torch + dev group)
        run: uv sync --locked --extra cpu --group dev

      - name: Provide machine config
        run: cp config.toml.example config.toml

      - name: Run unit tests (excludes integration)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing
