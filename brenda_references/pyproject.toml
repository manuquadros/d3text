[project]
name = "brenda_references"
dynamic = ["version"]
description = ""
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
  "aiotinydb>=2.0.0,<3",
  "apiadapters @ git+https://github.com/manuquadros/apiadapters",
  "cacheout>=0.16.0,<0.17",
  "d3types @ git+https://github.com/manuquadros/d3types",
  "frozendict>=2.4.6",
  "lpsn-interface @ git+https://github.com/manuquadros/lpsn-interface",
  "ncbitax @ git+https://github.com/manuquadros/ncbitax",
  "nltk>=3.9.1,<4",
  "orjson>=3.10.15",
  "pandas>=2.2.3,<3",
  "plotnine>=0.15.3",
  "pydantic>=2.10.5,<3",
  "rapidfuzz>=3.10.1,<4",
  "retrying>=1.3.4,<2",
  "sqlmodel==0.*",
  "stackprinter>=0.2.12",
  "tinydb>=4.8.2,<5",
  "tqdm>=4.67.0,<5",
  "huggingface-hub>=1.28.0",
]

[project.scripts]
sync-doc-db = "brenda_references.brenda_references:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"

# The data blobs are fetched from the Hugging Face Hub, never shipped. Without
# this the wheel would carry whatever the checkout happened to hold -- around
# 700 MB of git-lfs splits -- and copy it into site-packages on every install,
# while still missing the two blobs that are in no git at all. The manifest and
# its README stay in the package: they are a few hundred bytes and name the Hub
# revision the recorded model numbers came from.
[tool.pdm.build]
excludes = [
  "src/brenda_references/data/*.csv",
  "src/brenda_references/data/*.json",
  "src/brenda_references/data/.cache/**",
]

[tool.pdm.scripts]
changelog = "git-cliff --output CHANGELOG.md"
next-version = "git-cliff --bumped-version"
release = "python scripts/release.py"

[dependency-groups]
dev = [
  "git-cliff>=2.13.1",
  "ipython-autotime>=0.3.2",
  "pandas-stubs>=2.3.2.250827",
  "pip-check>=3.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "types-tqdm>=4.67.0.20250809",
]

# Same split the root pyproject.toml documents for these two: d3types pins
# lpsn-interface through a different URL spelling than the one declared
# below, and pdm (unlike uv) treats a direct-reference URL as part of the
# package's identity, so an unresolved standalone lock sees two different
# packages named lpsn-interface. ncbitax carries the same split.
[tool.pdm.resolution.overrides]
lpsn-interface = "git+https://github.com/manuquadros/lpsn-interface"
ncbitax = "git+https://github.com/manuquadros/ncbitax"

[tool.pytest.ini_options]
addopts = ["--cov=brenda_references", "--cov-report=xml", "-m", "not integration"]
markers = [
  "integration: needs network, GPU, or the full BRENDA data files",
]
